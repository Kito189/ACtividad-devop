name: Build, Push to ECR and Deploy to EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 730335429934.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imágenes a ECR
        run: |
          docker build -t $ECR_REGISTRY/backenddevop:latest ./backend
          docker push $ECR_REGISTRY/backenddevop:latest
          
          docker build -t $ECR_REGISTRY/dbdevop:latest ./db
          docker push $ECR_REGISTRY/dbdevop:latest
          
          docker build -t $ECR_REGISTRY/frontenddevop:latest ./frontend
          docker push $ECR_REGISTRY/frontenddevop:latest

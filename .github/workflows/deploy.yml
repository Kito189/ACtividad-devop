name: Build, Push to ECR and Deploy to EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 730335429934.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imágenes a ECR
        run: |
          docker build -t $ECR_REGISTRY/backenddevop:latest ./backend
          docker push $ECR_REGISTRY/backenddevop:latest

          docker build -t $ECR_REGISTRY/dbdevop:latest ./db
          docker push $ECR_REGISTRY/dbdevop:latest

          docker build -t $ECR_REGISTRY/frontenddevop:latest ./frontend
          docker push $ECR_REGISTRY/frontenddevop:latest

      - name: Deploy en EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          # Pasamos las credenciales directamente como variables de entorno al SSH
          envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN
         with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          script: |
            # Forzamos las variables dentro de la sesión remota de la EC2
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            export AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}"
            export AWS_DEFAULT_REGION="us-east-1"
            
            # Ahora el login no fallará jamás porque tiene las llaves inyectadas en vivo
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 730335429934.dkr.ecr.us-east-1.amazonaws.com
            
            cd ~/ACtividad-devop
            git pull origin main
            docker-compose pull
            docker-compose up -d --remove-orphans
